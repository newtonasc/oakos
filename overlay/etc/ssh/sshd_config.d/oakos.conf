# Root nao tem senha nesta VM (ver 'passwd -d root' no chroot-setup.sh) --
# entao entrar por ssh so pode ser por chave publica. PermitEmptyPasswords
# ja bloqueia senha vazia por padrao, mas deixamos explicito aqui: sem
# 'authorized_keys' configurado, ninguem entra por ssh de jeito nenhum.
PermitRootLogin prohibit-password
PasswordAuthentication no
